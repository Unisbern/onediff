<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud mini app</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(165deg, #b8dfff 0%, #d3e9ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .app {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 32px 20px 36px;
            box-shadow: 0 30px 50px -10px rgba(0, 60, 120, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .typing-header {
            font-size: 32px;
            font-weight: 650;
            color: #043753;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 16px 24px;
            border-radius: 80px;
            margin-bottom: 42px;
            border: 1px solid rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(0,30,60,0.1);
        }
        #typeText, #typeText2 {
            display: inline-block;
        }
        .cursor {
            width: 4px;
            height: 34px;
            background: #043753;
            margin-left: 8px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        
        /* страницы */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        
        /* страница 1 - облако */
        .cloud-section {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .cloud-cute {
            position: relative;
            width: 280px;
            height: 120px;
            background: linear-gradient(145deg, #f9fcff, #e2f0ff);
            border-radius: 120px;
            box-shadow: 0 20px 30px -5px rgba(0, 90, 160, 0.25), inset 0 -3px 8px rgba(0,0,0,0.03);
            border: 2px solid white;
            overflow: hidden;
        }
        .cloud-cute::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            background: inherit;
            border-radius: 50%;
            top: -40px;
            left: 25px;
            border: 2px solid white;
            box-shadow: 0 8px 12px rgba(0,0,0,0.05);
            z-index: 2;
        }
        .cloud-cute::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: inherit;
            border-radius: 50%;
            top: -55px;
            right: 20px;
            border: 2px solid white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            z-index: 2;
        }
        .cloud-cute .puff-left {
            position: absolute;
            width: 60px;
            height: 60px;
            background: inherit;
            border-radius: 50%;
            top: -20px;
            left: -10px;
            border: 2px solid white;
            box-shadow: 0 6px 10px rgba(0,0,0,0.05);
            z-index: 2;
        }
        .cloud-cute .puff-right {
            position: absolute;
            width: 70px;
            height: 70px;
            background: inherit;
            border-radius: 50%;
            bottom: -20px;
            right: 10px;
            border: 2px solid white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.07);
            z-index: 2;
        }
        .cloud-water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #3a99f0;
            border-radius: 0 0 120px 120px;
            transition: height 5s cubic-bezier(0.5, 0, 0.3, 1);
            height: 80%;
            box-shadow: inset 0 6px 10px #1b5e9e;
            z-index: 1;
            opacity: 0.85;
        }
        .income-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 32px;
            font-weight: 750;
            color: #0f4a73;
            z-index: 20;
            border: 1px solid white;
            white-space: nowrap;
            box-shadow: 0 8px 22px rgba(0, 40, 80, 0.3);
        }
        .income-badge small {
            font-size: 20px;
            font-weight: 400;
            color: #256f9e;
            margin-left: 5px;
        }
        .drops-rain {
            position: relative;
            width: 100%;
            height: 100px;
            pointer-events: none;
            margin-top: 5px;
            z-index: 15;
        }
        .drop {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #3a99f0;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            opacity: 0.8;
            box-shadow: 0 4px 10px #479ef0;
            left: var(--x);
            animation: rainfall 1.9s infinite ease-in;
            top: -10px;
        }
        .drop1 { --x: 20%; left: 20%; width: 14px; height: 14px; animation-delay: 0.1s; }
        .drop2 { --x: 48%; left: 48%; width: 11px; height: 11px; animation-delay: 0.9s; }
        .drop3 { --x: 76%; left: 76%; width: 13px; height: 13px; animation-delay: 1.5s; }
        @keyframes rainfall {
            0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.9; }
            80% { transform: translateY(110px) rotate(-45deg) scale(0.9); opacity: 0.3; }
            100% { transform: translateY(140px) rotate(-45deg) scale(0.5); opacity: 0; }
        }
        .top-cards {
            display: flex;
            gap: 12px;
            margin: 16px 0 12px;
        }
        .card {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 38px;
            padding: 24px 0 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 620;
            color: #083e5c;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 12px 22px rgba(0, 50, 80, 0.15);
            position: relative;
            overflow: hidden;
        }
        .card-water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #3a99f0;
            transition: height 1.2s ease-out;
            z-index: 0;
            border-radius: 0 0 38px 38px;
            opacity: 0.55;
            box-shadow: inset 0 4px 8px #0f5390;
        }
        .card-content {
            position: relative;
            z-index: 2;
        }
        .card-third {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 38px;
            padding: 24px 0 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 620;
            color: #083e5c;
            border: 1px solid white;
            box-shadow: 0 12px 22px rgba(0, 50, 80, 0.15);
            position: relative;
            overflow: hidden;
            margin-top: 0;
        }
        .card-third .card-water {
            height: 5px;
            opacity: 0.6;
            background: #2a80d9;
        }
        
        /* страница 2 - бюджет */
        .budget-header {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #043753;
            border: 1px solid white;
            margin: 20px 0;
            box-shadow: 0 8px 16px rgba(0,40,70,0.1);
        }
        .budget-header span {
            font-size: 18px;
            font-weight: 400;
            color: #256f9e;
            margin-left: 8px;
        }
        .expenses-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 24px 0;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .expense-item {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 10px rgba(0,30,60,0.1);
        }
        .expense-title {
            font-size: 18px;
            font-weight: 600;
            color: #043753;
            margin-bottom: 10px;
        }
        .expense-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .expense-months {
            font-size: 16px;
            font-weight: 500;
            color: #1f5f8b;
            min-width: 40px;
        }
        .expense-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #3a99f0 0%, #9ac7ff var(--percent, 50%), #c0d6eb var(--percent, 50%));
            border-radius: 10px;
            outline: none;
        }
        .expense-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,60,120,0.4);
            border: 2px solid #3a99f0;
            cursor: pointer;
        }
        .expense-input {
            width: 70px;
            padding: 8px 0 8px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.7);
            font-size: 16px;
            font-weight: 500;
            color: #043753;
            outline: none;
        }
        .expense-input:focus {
            border-color: #3a99f0;
            background: white;
        }
        .expense-amount {
            font-size: 16px;
            font-weight: 600;
            color: #0f4a73;
            min-width: 70px;
            text-align: right;
        }
        .add-button {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border: 2px dashed #3a99f0;
            border-radius: 60px;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: 600;
            color: #043753;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .add-button:hover {
            background: rgba(58, 153, 240, 0.2);
        }
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }
        .nav-dot {
            width: 40px;
            height: 6px;
            background: rgba(25, 75, 130, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-dot.active-dot {
            background: #1f6db0;
            width: 60px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- СТРАНИЦА 1 -->
    <div id="page1" class="page active">
        <div class="typing-header">
            <span id="typeText"></span><span class="cursor"></span>
        </div>
        <div class="cloud-section">
            <div class="cloud-cute">
                <div class="puff-left"></div>
                <div class="puff-right"></div>
                <div class="cloud-water" id="cloudWater" style="height: 85%;"></div>
                <div class="income-badge">180 <small>₽</small></div>
            </div>
        </div>
        <div class="drops-rain">
            <div class="drop drop1"></div>
            <div class="drop drop2"></div>
            <div class="drop drop3"></div>
        </div>
        <div class="top-cards">
            <div class="card" id="card1">
                <div class="card-water" id="cardWater1" style="height: 12%;"></div>
                <div class="card-content">Озоны<span></span></div>
            </div>
            <div class="card" id="card2">
                <div class="card-water" id="cardWater2" style="height: 18%;"></div>
                <div class="card-content">Айфоны<span></span></div>
            </div>
        </div>
        <div class="card-third" id="card3">
            <div class="card-water" style="height: 5px;"></div>
            <div class="card-content">Личное поместье<span></span></div>
        </div>
    </div>

    <!-- СТРАНИЦА 2 - БЮДЖЕТ -->
    <div id="page2" class="page page-2">
        <div class="typing-header">
            <span id="typeText2"></span><span class="cursor"></span>
        </div>
        <div class="budget-header" id="budgetDisplay">180000 <span>₽</span></div>
        
        <div class="expenses-list" id="expensesList">
            <!-- будут добавляться элементы динамически -->
        </div>
        
        <button class="add-button" id="addExpenseBtn">+ добавить вещь</button>
    </div>

    <!-- навигация -->
    <div class="nav-dots">
        <div class="nav-dot active-dot" data-page="1"></div>
        <div class="nav-dot" data-page="2"></div>
    </div>
</div>

<script>
    // печатный текст 1
    const line1 = "Привет, это облако";
    const out1 = document.getElementById('typeText');
    let p1 = 0;
    function write1() {
        if (p1 < line1.length) {
            out1.textContent += line1.charAt(p1);
            p1++;
            setTimeout(write1, 120);
        }
    }
    write1();

    // печатный текст 2
    const line2 = "Бюджет планировщик";
    const out2 = document.getElementById('typeText2');
    let p2 = 0;
    function write2() {
        if (p2 < line2.length) {
            out2.textContent += line2.charAt(p2);
            p2++;
            setTimeout(write2, 120);
        }
    }
    write2();

    // облако: вода уходит быстрее и дольше стоит пустое
    const cloudWater = document.getElementById('cloudWater');
    let cl = 85;
    let emptyTimer = 0;
    let emptyInterval = null;
    
    function updateCloudWater() {
        if (cl > 20) {
            cl = Math.max(20, cl - 7);
            cloudWater.style.height = cl + '%';
            if (cl === 20) {
                emptyTimer = 0;
                if (emptyInterval) clearInterval(emptyInterval);
                emptyInterval = setInterval(() => {
                    emptyTimer += 1;
                    if (emptyTimer >= 8) {
                        cl = 85;
                        cloudWater.style.height = cl + '%';
                        clearInterval(emptyInterval);
                        emptyInterval = null;
                    }
                }, 1000);
            }
        }
    }
    
    setInterval(updateCloudWater, 2800);
    setTimeout(() => { cloudWater.style.height = '76%'; cl = 76; }, 2000);
    setTimeout(() => { cloudWater.style.height = '68%'; cl = 68; }, 4500);

    // карточки Озоны и Айфоны
    const w1 = document.getElementById('cardWater1');
    const w2 = document.getElementById('cardWater2');
    let f1 = 12, f2 = 18;
    setInterval(() => {
        if (f1 < 70) {
            f1 += Math.floor(Math.random() * 5) + 2;
            if (f1 > 70) f1 = 70;
            w1.style.height = f1 + '%';
        }
        if (f2 < 68) {
            f2 += Math.floor(Math.random() * 6) + 2;
            if (f2 > 68) f2 = 68;
            w2.style.height = f2 + '%';
        }
        if (Math.random() > 0.65) {
            f1 = Math.max(8, f1 - 2);
            f2 = Math.max(10, f2 - 2);
            w1.style.height = f1 + '%';
            w2.style.height = f2 + '%';
        }
    }, 1400);

    // ========== СТРАНИЦА 2: ЛОГИКА БЮДЖЕТА ==========
    let budget = 180000;
    const budgetDisplay = document.getElementById('budgetDisplay');
    const expensesList = document.getElementById('expensesList');
    
    // базовые элементы
    let expenses = [
        { id: 'food', name: 'еда', months: 1, amount: 0 },
        { id: 'housing', name: 'жильё', months: 1, amount: 0 }
    ];
    
    function updateBudgetDisplay() {
        budgetDisplay.innerHTML = Math.round(budget) + ' <span>₽</span>';
    }
    
    function recalcBudget() {
        let totalSpent = expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
        budget = 180000 - totalSpent;
        if (budget < 0) budget = 0;
        updateBudgetDisplay();
    }
    
    function renderExpenses() {
        expensesList.innerHTML = '';
        expenses.forEach((exp, index) => {
            const item = document.createElement('div');
            item.className = 'expense-item';
            item.dataset.id = exp.id || 'custom-' + index;
            
            const title = document.createElement('div');
            title.className = 'expense-title';
            title.textContent = exp.name + ' — ' + exp.months + ' мес';
            
            const controls = document.createElement('div');
            controls.className = 'expense-controls';
            
            const monthsSpan = document.createElement('span');
            monthsSpan.className = 'expense-months';
            monthsSpan.textContent = exp.months + 'м';
            
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.className = 'expense-slider';
            slider.min = 1;
            slider.max = 12;
            slider.value = exp.months;
            slider.style.setProperty('--percent', ((exp.months - 1) / 11 * 100) + '%');
            
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'expense-input';
            input.min = 0;
            input.max = 1000000;
            input.value = exp.amount;
            input.placeholder = 'сумма';
            
            const amountSpan = document.createElement('span');
            amountSpan.className = 'expense-amount';
            amountSpan.textContent = '− ' + (exp.amount / exp.months).toFixed(0) + '₽/мес';
            
            slider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                exp.months = val;
                monthsSpan.textContent = val + 'м';
                title.textContent = exp.name + ' — ' + val + ' мес';
                slider.style.setProperty('--percent', ((val - 1) / 11 * 100) + '%');
                amountSpan.textContent = '− ' + (exp.amount / val).toFixed(0) + '₽/мес';
                recalcBudget();
            });
            
            input.addEventListener('input', (e) => {
                let val = parseInt(e.target.value) || 0;
                if (val < 0) val = 0;
                exp.amount = val;
                amountSpan.textContent = '− ' + (val / exp.months).toFixed(0) + '₽/мес';
                recalcBudget();
            });
            
            controls.appendChild(monthsSpan);
            controls.appendChild(slider);
            controls.appendChild(input);
            controls.appendChild(amountSpan);
            
            item.appendChild(title);
            item.appendChild(controls);
            expensesList.appendChild(item);
        });
        recalcBudget();
    }
    
    // добавление новой вещи
    document.getElementById('addExpenseBtn').addEventListener('click', () => {
        const newName = prompt('Введите название вещи (например, "кофе")');
        if (!newName || newName.trim() === '') return;
        
        const newExpense = {
            id: 'custom-' + Date.now(),
            name: newName.trim(),
            months: 1,
            amount: 0
        };
        expenses.push(newExpense);
        renderExpenses();
    });
    
    // первоначальный рендер
    renderExpenses();

    // переключение страниц
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const dots = document.querySelectorAll('.nav-dot');
    
    function goToPage(n) {
        if (n === 1) {
            page1.classList.add('active');
            page2.classList.remove('active');
            dots[0].classList.add('active-dot');
            dots[1].classList.remove('active-dot');
        } else {
            page2.classList.add('active');
            page1.classList.remove('active');
            dots[1].classList.add('active-dot');
            dots[0].classList.remove('active-dot');
        }
    }
    
    dots.forEach((d, idx) => d.addEventListener('click', () => goToPage(idx === 0 ? 1 : 2)));
</script>
</body>
</html>
