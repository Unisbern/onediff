<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Облако и капли — мини‑апп</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(165deg, #c7e2fd 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 48px;
            padding: 24px 16px 32px;
            box-shadow: 0 25px 40px -10px rgba(0, 50, 100, 0.3);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* машинка */
        .typing-header {
            font-size: 26px;
            font-weight: 600;
            color: #06314b;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        #typeText {
            display: inline-block;
        }
        .cursor {
            width: 3px;
            height: 30px;
            background: #0a3853;
            margin-left: 6px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

        /* облачный контейнер — теперь ничто не обрезает облако */
        .cloud-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
            z-index: 5;
        }

        /* САМО ОБЛАКО — пушистое, без обрезания */
        .cloud-big {
            position: relative;
            width: 260px;
            height: 110px;
            background: #bde1fe;
            border-radius: 100px;
            box-shadow: 0 12px 20px rgba(0,60,130,0.25), inset 0 -4px 8px rgba(0,0,0,0.05);
            border: 2px solid white;
            margin-bottom: 10px;
            /* УБИРАЕМ overflow hidden — теперь облако видно полностью */
            overflow: visible;
        }

        /* пушистые шапки облака (псевдоэлементы) */
        .cloud-big::before,
        .cloud-big::after {
            content: '';
            position: absolute;
            background: #bde1fe;
            border-radius: 50%;
            border: 2px solid white;
            z-index: 2;
        }
        .cloud-big::before {
            width: 80px;
            height: 80px;
            top: -35px;
            left: 30px;
            box-shadow: -2px 4px 10px rgba(0,0,0,0.1);
        }
        .cloud-big::after {
            width: 110px;
            height: 110px;
            top: -50px;
            right: 25px;
            box-shadow: 4px 8px 14px rgba(0,40,80,0.15);
        }

        /* вода внутри облака (синяя) */
        .cloud-water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e81d9;
            border-radius: 0 0 100px 100px;
            transition: height 5s cubic-bezier(0.5, 0, 0.3, 1);
            height: 80%; /* начальный уровень */
            box-shadow: inset 0 6px 10px #0f5b9e;
            z-index: 1;
        }

        /* бейдж с доходом ПОВЕРХ облака */
        .income-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 30px;
            font-weight: 700;
            color: #0c4c77;
            z-index: 20;
            border: 1px solid white;
            white-space: nowrap;
            box-shadow: 0 8px 18px rgba(0, 20, 50, 0.2);
        }
        .income-badge small {
            font-size: 18px;
            font-weight: 400;
            color: #2b628b;
            margin-left: 4px;
        }

        /* КОНТЕЙНЕР ДЛЯ КАПЕЛЬ (летят вниз) */
        .drops-rain {
            position: relative;
            width: 100%;
            height: 110px;  /* мостик от облака до карточек */
            pointer-events: none;
            margin-top: -20px; /* чуть ближе к облаку */
            z-index: 10;
        }

        .drop {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #1e81d9;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            opacity: 0.8;
            box-shadow: 0 4px 8px #3d93e6;
            left: var(--x);
            animation: rainfall 1.8s infinite ease-in;
            top: -10px;
        }

        /* три капли с разной задержкой и позициями */
        .drop1 { --x: 22%; left: 22%; animation-delay: 0s; }
        .drop2 { --x: 48%; left: 48%; width: 12px; height: 12px; animation-delay: 0.5s; }
        .drop3 { --x: 74%; left: 74%; width: 9px; height: 9px; animation-delay: 1.1s; }

        @keyframes rainfall {
            0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.9; }
            80% { transform: translateY(110px) rotate(-45deg) scale(0.9); opacity: 0.3; }
            100% { transform: translateY(130px) rotate(-45deg) scale(0.6); opacity: 0; }
        }

        /* КАРТОЧКИ (три штуки) в которые падают капли */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
            justify-content: center;
        }

        /* первые две карточки (слово1, слово2) — на одной строке */
        .card-top-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .card {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 24px 0 16px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #124c6e;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 10px 18px rgba(0, 40, 70, 0.15);
            position: relative;
            overflow: hidden;  /* скрываем переполнение воды */
        }

        .card span {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: #2d5f80;
            margin-top: 8px;
        }

        /* вода внутри карточек (синяя) */
        .card-water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e81d9;
            transition: height 1.2s ease-out;
            z-index: 0;
            border-radius: 0 0 32px 32px;
            opacity: 0.6;
            box-shadow: inset 0 4px 6px #0c5290;
        }

        /* текст и иконка поверх воды */
        .card-content {
            position: relative;
            z-index: 2;
        }

        /* карточка №3 отдельно — всегда чуть воды внизу */
        .card-special {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 38px;
            padding: 24px 0 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #0a3b58;
            border: 1px solid white;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 18px rgba(0,40,70,0.15);
        }
        .card-special .card-water {
            height: 28px;  /* всегда на дне */
            opacity: 0.7;
            background: #1470b8;
        }

        /* навигационные точки (страницы) */
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }
        .nav-dot {
            width: 40px;
            height: 6px;
            background: rgba(25, 80, 130, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-dot.active-dot {
            background: #1a69a8;
            width: 60px;
        }

        /* страница 2 заглушка */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .page-2-placeholder {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 50px 20px;
            text-align: center;
            color: #0d4b72;
            font-size: 24px;
            border: 1px solid white;
            margin: 30px 0;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- страница 1 -->
    <div id="page1" class="page active">
        <!-- печатный заголовок -->
        <div class="typing-header">
            <span id="typeText"></span><span class="cursor"></span>
        </div>

        <!-- облачная зона (полностью видимая) -->
        <div class="cloud-section">
            <div class="cloud-big">
                <div class="cloud-water" id="cloudWater" style="height: 85%;"></div>
                <div class="income-badge">180 <small>₽</small></div>
            </div>
        </div>

        <!-- капли, летящие вниз (позиции над карточками) -->
        <div class="drops-rain">
            <div class="drop drop1"></div>
            <div class="drop drop2"></div>
            <div class="drop drop3"></div>
        </div>

        <!-- карточки 1 и 2 (верхний ряд) -->
        <div class="cards-container">
            <div class="card-top-row">
                <!-- карточка слово1 -->
                <div class="card" id="card1">
                    <div class="card-water" id="cardWater1" style="height: 10%;"></div>
                    <div class="card-content">слово1 <span>⚡</span></div>
                </div>
                <!-- карточка слово2 -->
                <div class="card" id="card2">
                    <div class="card-water" id="cardWater2" style="height: 15%;"></div>
                    <div class="card-content">слово2 <span>💧</span></div>
                </div>
            </div>

            <!-- карточка слово3 (отдельно, вода всегда на дне) -->
            <div class="card-special" id="card3">
                <div class="card-water" style="height: 28px;"></div>
                <div class="card-content">слово3 <span>🌊 всегда на дне</span></div>
            </div>
        </div>
    </div>

    <!-- страница 2 (для навигации) -->
    <div id="page2" class="page page-2">
        <div class="typing-header">
            <span id="typeText2"></span><span class="cursor"></span>
        </div>
        <div class="page-2-placeholder">
            🌤 вторая страница<br> (тут может быть график)
        </div>
        <div class="nav-dots" style="margin-top: 40px;"> <!-- чтобы не сбить основные точки, но они снизу общие -->
        </div>
    </div>

    <!-- навигация страниц -->
    <div class="nav-dots">
        <div class="nav-dot active-dot" data-page="1"></div>
        <div class="nav-dot" data-page="2"></div>
    </div>
</div>

<script>
    (function() {
        // 1. ПЕЧАТНЫЙ ТЕКСТ (первая страница)
        const text1 = "Привет, облако";
        const typeSpan = document.getElementById('typeText');
        let i1 = 0;
        function print1() {
            if (i1 < text1.length) {
                typeSpan.textContent += text1.charAt(i1);
                i1++;
                setTimeout(print1, 120);
            }
        }
        print1();

        // 2. ПЕЧАТНЫЙ ТЕКСТ (вторая страница)
        const text2 = "Страница два";
        const typeSpan2 = document.getElementById('typeText2');
        let i2 = 0;
        function print2() {
            if (i2 < text2.length) {
                typeSpan2.textContent += text2.charAt(i2);
                i2++;
                setTimeout(print2, 120);
            }
        }
        print2();

        // 3. ОБЛАКО: уровень воды постепенно понижается (как и просила)
        const cloudWater = document.getElementById('cloudWater');
        let waterLevel = 85; // процентов
        function lowerCloudWater() {
            if (waterLevel > 25) {
                waterLevel = Math.max(25, waterLevel - 7);
            } else {
                waterLevel = 80; // возвращаем для цикличности
            }
            cloudWater.style.height = waterLevel + '%';
        }
        setInterval(lowerCloudWater, 6000);
        // пара быстрых изменений для живости
        setTimeout(() => { cloudWater.style.height = '76%'; waterLevel = 76; }, 2000);
        setTimeout(() => { cloudWater.style.height = '68%'; waterLevel = 68; }, 4500);

        // 4. НАПОЛНЕНИЕ КАРТОЧЕК 1 и 2 от капель (имитация)
        const cardWater1 = document.getElementById('cardWater1');
        const cardWater2 = document.getElementById('cardWater2');
        let fill1 = 10, fill2 = 15;

        // капли "падают" и увеличивают уровень (эмуляция)
        setInterval(() => {
            // случайное прибавление для первой карточки
            if (fill1 < 70) {
                fill1 += Math.floor(Math.random() * 6) + 2;  // +2..7
                if (fill1 > 70) fill1 = 70;
                cardWater1.style.height = fill1 + '%';
            }
            // для второй карточки
            if (fill2 < 68) {
                fill2 += Math.floor(Math.random() * 5) + 3; // +3..7
                if (fill2 > 68) fill2 = 68;
                cardWater2.style.height = fill2 + '%';
            }

            // изредка немного убывает (испарение/сток) — чтобы было динамично
            if (Math.random() > 0.7) {
                fill1 = Math.max(8, fill1 - 2);
                fill2 = Math.max(10, fill2 - 3);
                cardWater1.style.height = fill1 + '%';
                cardWater2.style.height = fill2 + '%';
            }
        }, 1300);

        // КАРТОЧКА 3 — вода всегда на дне (уже задано в style, трогать не надо)

        // 5. ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ (как в прошлый раз, но с исправлением)
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const dots = document.querySelectorAll('.nav-dot');

        function setActive(pageNum) {
            if (pageNum === 1) {
                page1.classList.add('active');
                page2.classList.remove('active');
                dots[0].classList.add('active-dot');
                dots[1].classList.remove('active-dot');
            } else {
                page2.classList.add('active');
                page1.classList.remove('active');
                dots[1].classList.add('active-dot');
                dots[0].classList.remove('active-dot');
            }
        }

        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => {
                setActive(idx === 0 ? 1 : 2);
            });
        });

        // 6. Небольшая фишка: капли визуально падают в карточки (уже за счёт анимации)
        // всё ок
    })();
</script>

<!-- 
    Что исправлено:
    - Облако теперь не обрезается (убрал overflow hidden у родителя, исправил псевдоэлементы)
    - Капли летят прямо в зону карточек (их траектория видна)
    - Слово1 и слово2 наполняются синей водой (динамически), слово3 — вода всегда на дне
    - Дизайн стал воздушнее, облако пушистое
-->
</body>
</html>
