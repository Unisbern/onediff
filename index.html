<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud mini app</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(165deg, #b8dfff 0%, #d3e9ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .app {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 32px 20px 36px;
            box-shadow: 0 30px 50px -10px rgba(0, 60, 120, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .typing-header {
            font-size: 32px;
            font-weight: 650;
            color: #043753;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 16px 24px;
            border-radius: 80px;
            margin-bottom: 42px;
            border: 1px solid rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(0,30,60,0.1);
        }
        #typeText {
            display: inline-block;
        }
        .cursor {
            width: 4px;
            height: 34px;
            background: #043753;
            margin-left: 8px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        .cloud-section {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .cloud-cute {
            position: relative;
            width: 280px;
            height: 120px;
            background: linear-gradient(145deg, #f9fcff, #e2f0ff);
            border-radius: 120px;
            box-shadow: 0 20px 30px -5px rgba(0, 90, 160, 0.25), inset 0 -3px 8px rgba(0,0,0,0.03);
            border: 2px solid white;
            overflow: visible;
        }
        .cloud-cute::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            background: inherit;
            border-radius: 50%;
            top: -40px;
            left: 25px;
            border: 2px solid white;
            box-shadow: 0 8px 12px rgba(0,0,0,0.05);
            z-index: 2;
        }
        .cloud-cute::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: inherit;
            border-radius: 50%;
            top: -55px;
            right: 20px;
            border: 2px solid white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            z-index: 2;
        }
        .cloud-cute .puff-left {
            position: absolute;
            width: 60px;
            height: 60px;
            background: inherit;
            border-radius: 50%;
            top: -20px;
            left: -10px;
            border: 2px solid white;
            box-shadow: 0 6px 10px rgba(0,0,0,0.05);
            z-index: 2;
        }
        .cloud-cute .puff-right {
            position: absolute;
            width: 70px;
            height: 70px;
            background: inherit;
            border-radius: 50%;
            bottom: -20px;
            right: 10px;
            border: 2px solid white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.07);
            z-index: 2;
        }
        .cloud-water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #3a99f0;
            border-radius: 0 0 120px 120px;
            transition: height 5s cubic-bezier(0.5, 0, 0.3, 1);
            height: 80%;
            box-shadow: inset 0 6px 10px #1b5e9e;
            z-index: 1;
            opacity: 0.85;
        }
        .income-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 32px;
            font-weight: 750;
            color: #0f4a73;
            z-index: 20;
            border: 1px solid white;
            white-space: nowrap;
            box-shadow: 0 8px 22px rgba(0, 40, 80, 0.3);
        }
        .income-badge small {
            font-size: 20px;
            font-weight: 400;
            color: #256f9e;
            margin-left: 5px;
        }
        .drops-rain {
            position: relative;
            width: 100%;
            height: 100px;
            pointer-events: none;
            margin-top: 5px;
            z-index: 15;
        }
        .drop {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #3a99f0;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            opacity: 0.8;
            box-shadow: 0 4px 10px #479ef0;
            left: var(--x);
            animation: rainfall 1.9s infinite ease-in;
            top: -10px;
        }
        .drop1 { --x: 20%; left: 20%; width: 14px; height: 14px; animation-delay: 0.1s; }
        .drop2 { --x: 48%; left: 48%; width: 11px; height: 11px; animation-delay: 0.9s; }
        .drop3 { --x: 76%; left: 76%; width: 13px; height: 13px; animation-delay: 1.5s; }
        @keyframes rainfall {
            0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.9; }
            80% { transform: translateY(110px) rotate(-45deg) scale(0.9); opacity: 0.3; }
            100% { transform: translateY(140px) rotate(-45deg) scale(0.5); opacity: 0; }
        }
        .cards-row {
            display: flex;
            gap: 12px;
            margin: 16px 0 10px;
        }
        .card {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 38px;
            padding: 24px 0 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 620;
            color: #083e5c;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 12px 22px rgba(0, 50, 80, 0.15);
            position: relative;
            overflow: hidden;
        }
        .card span {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #235d83;
            margin-top: 6px;
            opacity: 0.9;
        }
        .card-water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #3a99f0;
            transition: height 1.2s ease-out;
            z-index: 0;
            border-radius: 0 0 38px 38px;
            opacity: 0.55;
            box-shadow: inset 0 4px 8px #0f5390;
        }
        .card-content {
            position: relative;
            z-index: 2;
        }
        .card-third {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 38px;
            padding: 24px 0 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 620;
            color: #083e5c;
            border: 1px solid white;
            box-shadow: 0 12px 22px rgba(0, 50, 80, 0.15);
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .card-third .card-water {
            height: 22px;
            opacity: 0.6;
            background: #2a80d9;
        }
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
        }
        .nav-dot {
            width: 40px;
            height: 6px;
            background: rgba(25, 75, 130, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-dot.active-dot {
            background: #1f6db0;
            width: 60px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .page-2-placeholder {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 60px 20px;
            text-align: center;
            color: #115077;
            font-size: 26px;
            border: 1px solid white;
            margin: 30px 0;
        }
    </style>
</head>
<body>
<div class="app">
    <div id="page1" class="page active">
        <div class="typing-header">
            <span id="typeText"></span><span class="cursor"></span>
        </div>
        <div class="cloud-section">
            <div class="cloud-cute">
                <div class="puff-left"></div>
                <div class="puff-right"></div>
                <div class="cloud-water" id="cloudWater" style="height: 82%;"></div>
                <div class="income-badge">180 <small>₽</small></div>
            </div>
        </div>
        <div class="drops-rain">
            <div class="drop drop1"></div>
            <div class="drop drop2"></div>
            <div class="drop drop3"></div>
        </div>
        <div class="cards-row">
            <div class="card" id="card1">
                <div class="card-water" id="cardWater1" style="height: 12%;"></div>
                <div class="card-content">Озоны<span></span></div>
            </div>
            <div class="card" id="card2">
                <div class="card-water" id="cardWater2" style="height: 18%;"></div>
                <div class="card-content">Айфоны<span></span></div>
            </div>
            <div class="card-third" id="card3">
                <div class="card-water" style="height: 22px;"></div>
                <div class="card-content">Личное поместье<span></span></div>
            </div>
        </div>
    </div>
    <div id="page2" class="page page-2">
        <div class="typing-header">
            <span id="typeText2"></span><span class="cursor"></span>
        </div>
        <div class="page-2-placeholder">
            ☁️ вторая страница
        </div>
    </div>
    <div class="nav-dots">
        <div class="nav-dot active-dot" data-page="1"></div>
        <div class="nav-dot" data-page="2"></div>
    </div>
</div>
<script>
    const line1 = "Привет, это облако";
    const out1 = document.getElementById('typeText');
    let p1 = 0;
    function write1() {
        if (p1 < line1.length) {
            out1.textContent += line1.charAt(p1);
            p1++;
            setTimeout(write1, 120);
        }
    }
    write1();

    const line2 = "Другая страница";
    const out2 = document.getElementById('typeText2');
    let p2 = 0;
    function write2() {
        if (p2 < line2.length) {
            out2.textContent += line2.charAt(p2);
            p2++;
            setTimeout(write2, 120);
        }
    }
    write2();

    const cloudWater = document.getElementById('cloudWater');
    let cl = 82;
    setInterval(() => {
        if (cl > 28) cl = Math.max(28, cl - 7);
        else cl = 78;
        cloudWater.style.height = cl + '%';
    }, 6000);
    setTimeout(() => { cloudWater.style.height = '74%'; cl = 74; }, 2000);
    setTimeout(() => { cloudWater.style.height = '65%'; cl = 65; }, 5000);

    const w1 = document.getElementById('cardWater1');
    const w2 = document.getElementById('cardWater2');
    let f1 = 12, f2 = 18;
    setInterval(() => {
        if (f1 < 70) {
            f1 += Math.floor(Math.random() * 5) + 2;
            if (f1 > 70) f1 = 70;
            w1.style.height = f1 + '%';
        }
        if (f2 < 68) {
            f2 += Math.floor(Math.random() * 6) + 2;
            if (f2 > 68) f2 = 68;
            w2.style.height = f2 + '%';
        }
        if (Math.random() > 0.65) {
            f1 = Math.max(8, f1 - 2);
            f2 = Math.max(10, f2 - 2);
            w1.style.height = f1 + '%';
            w2.style.height = f2 + '%';
        }
    }, 1400);

    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const dots = document.querySelectorAll('.nav-dot');
    function goToPage(n) {
        if (n === 1) {
            page1.classList.add('active');
            page2.classList.remove('active');
            dots[0].classList.add('active-dot');
            dots[1].classList.remove('active-dot');
        } else {
            page2.classList.add('active');
            page1.classList.remove('active');
            dots[1].classList.add('active-dot');
            dots[0].classList.remove('active-dot');
        }
    }
    dots.forEach((d, idx) => d.addEventListener('click', () => goToPage(idx === 0 ? 1 : 2)));
</script>
</body>
</html>
