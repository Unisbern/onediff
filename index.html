<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #d4e9ff 0%, #e0f0fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            margin: 0;
        }

        /* Основной контейнер — две страницы, листаются свайпом или кликом по навигации */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 30, 60, 0.2);
            overflow: hidden;
            padding: 20px 16px 24px;
            border: 1px solid rgba(255,255,255,0.7);
        }

        /* Стили для страниц (две штуки) */
        .page {
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
        }

        /* Заголовок с печатной машинкой */
        .typing-header {
            font-size: 26px;
            font-weight: 600;
            color: #0b2b44;
            margin: 8px 0 24px 0;
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.3);
            padding: 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 28px;
            background-color: #0b2b44;
            margin-left: 6px;
            animation: blink 0.9s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* облачный блок */
        .cloud-section {
            background: rgba(255,255,255,0.5);
            border-radius: 48px;
            padding: 22px 16px 30px;
            margin-bottom: 24px;
            backdrop-filter: blur(6px);
            border: 1px solid white;
            box-shadow: 0 10px 20px rgba(0,40,70,0.1);
        }

        .cloud-label {
            font-size: 14px;
            font-weight: 500;
            color: #2c5779;
            margin-bottom: 6px;
            padding-left: 8px;
            letter-spacing: 0.3px;
        }

        /* контейнер облака с водой и каплями */
        .cloud-dynamic {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* само облако (основа) */
        .cloud-shape {
            position: relative;
            width: 220px;
            height: 90px;
            background: #b0daf8;  /* базовый голубой, но вода будет синей внутри */
            border-radius: 80px;
            box-shadow: 0 8px 12px rgba(0,60,120,0.2), inset 0 -4px 8px rgba(0,0,0,0.05);
            overflow: hidden;  /* чтобы уровень воды не вылезал */
            border: 2px solid white;
            margin-bottom: 8px;
        }

        /* псевдоэлементы для пушистости облака */
        .cloud-shape::before,
        .cloud-shape::after {
            content: '';
            position: absolute;
            background: #b0daf8;
            border-radius: 50%;
            box-shadow: inherit;
            border: 2px solid white;
            z-index: 1;
        }
        .cloud-shape::before {
            width: 70px;
            height: 70px;
            top: -30px;
            left: 25px;
        }
        .cloud-shape::after {
            width: 100px;
            height: 100px;
            top: -45px;
            right: 20px;
        }

        /* синяя вода внутри облака — заполняет по высоте */
        .water-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e81d9;  /* насыщенный синий */
            transition: height 6s cubic-bezier(0.65, 0, 0.35, 1);
            height: 80%; /* изначально 80% (как полное) — будет уменьшаться */
            border-radius: 0 0 80px 80px;
            box-shadow: inset 0 4px 8px rgba(0,60,120,0.4);
            z-index: 2;
        }

        /* отблеск на воде */
        .water-level::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 10%;
            width: 40%;
            height: 6px;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
            filter: blur(2px);
        }

        /* цифровой доход поверх облака */
        .income-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 10px 26px;
            border-radius: 60px;
            font-size: 28px;
            font-weight: 700;
            color: #0b4770;
            z-index: 10;
            border: 1px solid white;
            box-shadow: 0 6px 12px rgba(0, 30, 60, 0.2);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .income-badge span {
            font-size: 18px;
            font-weight: 400;
            color: #2f577b;
            margin-left: 6px;
        }

        /* капли */
        .drops-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 6px;
            height: 45px;
        }

        .drop {
            width: 8px;
            height: 8px;
            background: #1e81d9;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            animation: drip 2.2s infinite ease-in;
            opacity: 0.6;
            box-shadow: 0 4px 8px #60a9e6;
        }
        .drop:nth-child(2) {
            animation-delay: 0.7s;
            width: 7px;
            height: 7px;
            background: #3c9cf0;
        }
        .drop:nth-child(3) {
            animation-delay: 1.3s;
            width: 10px;
            height: 10px;
            background: #0f6ab0;
        }

        @keyframes drip {
            0% {
                transform: translateY(0) rotate(-45deg) scale(1);
                opacity: 0.8;
            }
            70% {
                transform: translateY(28px) rotate(-45deg) scale(0.9);
                opacity: 0.2;
            }
            100% {
                transform: translateY(40px) rotate(-45deg) scale(0.5);
                opacity: 0;
            }
        }

        /* три прямоугольника (карточки) */
        .cards-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 20px 0;
            border-radius: 28px;
            flex: 1;
            text-align: center;
            box-shadow: 0 8px 14px rgba(0,40,70,0.1);
            border: 1px solid rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            font-weight: 600;
            font-size: 18px;
            color: #103f5e;
            transition: 0.15s;
            background: rgba(255,255,255,0.75);
        }
        .card span {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #4f6f88;
            margin-top: 6px;
        }

        /* под карточками небольшая навигация по страницам */
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }
        .nav-dot {
            width: 44px;
            height: 6px;
            background: rgba(30, 100, 150, 0.3);
            border-radius: 20px;
            transition: 0.2s;
            cursor: pointer;
        }
        .nav-dot.active-dot {
            background: #1e6eb5;
            width: 60px;
        }

        /* вторая страница (для примера другое наполнение) */
        .page-2 .typing-header {
            content: "другая страница";
        }
        .page-2-placeholder {
            background: rgba(255,255,255,0.5);
            border-radius: 40px;
            padding: 40px 20px;
            text-align: center;
            color: #154a6e;
            font-size: 22px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid white;
            margin: 30px 0;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- СТРАНИЦА 1 (главная) -->
    <div id="page1" class="page active">
        <!-- заголовок с печатным эффектом -->
        <div class="typing-header" id="typingHeader"> 
            <span id="typeText"></span><span class="cursor"></span>
        </div>

        <!-- облачная зона -->
        <div class="cloud-section">
            <div class="cloud-label">Ваш доход</div>
            <div class="cloud-dynamic">
                <div class="cloud-shape" id="cloudShape">
                    <!-- уровень воды (синий) -->
                    <div class="water-level" id="waterLevel" style="height: 80%;"></div>
                    <!-- цифровой доход -->
                    <div class="income-badge">180 <span>₽</span></div>
                </div>
                <!-- капли -->
                <div class="drops-container">
                    <div class="drop"></div>
                    <div class="drop"></div>
                    <div class="drop"></div>
                </div>
            </div>
        </div>

        <!-- три прямоугольника с подписями -->
        <div class="cards-row">
            <div class="card">слово1 <span>⚡️</span></div>
            <div class="card">слово2 <span>✨</span></div>
            <div class="card">слово3 <span>💧</span></div>
        </div>
    </div>

    <!-- СТРАНИЦА 2 (дополнительная) -->
    <div id="page2" class="page page-2">
        <div class="typing-header" id="typingHeader2">
            <span id="typeText2"></span><span class="cursor"></span>
        </div>
        <div class="page-2-placeholder">
            🌤 здесь могла<br>быть ваша статистика
        </div>
        <!-- можно повторить карточки или что‑то ещё, но для простоты просто три таких же элемента (другая подпись) -->
        <div class="cards-row" style="margin-top: 20px;">
            <div class="card">день <span>📅</span></div>
            <div class="card">час <span>⏰</span></div>
            <div class="card">всего <span>📊</span></div>
        </div>
    </div>

    <!-- навигационные точки (переключение между страницами) -->
    <div class="nav-dots">
        <div class="nav-dot active-dot" data-page="1"></div>
        <div class="nav-dot" data-page="2"></div>
    </div>
</div>

<script>
    (function() {
        // ========== ПЕЧАТНЫЙ ТЕКСТ ДЛЯ ПЕРВОЙ СТРАНИЦЫ ==========
        const fullText = "Привет, это облако";
        const typeTextSpan = document.getElementById('typeText');
        let index = 0;

        function typeNextChar() {
            if (index < fullText.length) {
                typeTextSpan.textContent += fullText.charAt(index);
                index++;
                setTimeout(typeNextChar, 110); // скорость появления букв
            } else {
                // можно оставить курсор мигать вечно
            }
        }
        // стартуем печать при загрузке
        typeNextChar();

        // ========== ПЕЧАТНЫЙ ТЕКСТ ДЛЯ ВТОРОЙ СТРАНИЦЫ ==========
        const fullText2 = "А здесь страница 2";
        const typeTextSpan2 = document.getElementById('typeText2');
        let index2 = 0;
        function typeNextChar2() {
            if (index2 < fullText2.length) {
                typeTextSpan2.textContent += fullText2.charAt(index2);
                index2++;
                setTimeout(typeNextChar2, 120);
            }
        }
        // запускаем когда страница активируется? но проще сразу, он скрыт, но начнёт печатать. Ок
        typeNextChar2();

        // ========== АНИМАЦИЯ УРОВНЯ ВОДЫ (ПОНИЖЕНИЕ) ==========
        const waterLevel = document.getElementById('waterLevel');
        let waterHeight = 80; // процентов
        // понижаем с течением времени: каждые 8 секунд убавляем на 8%, минимум 20%
        function lowerWater() {
            if (waterHeight > 20) {
                waterHeight = Math.max(20, waterHeight - 8);
                waterLevel.style.height = waterHeight + '%';
            } else {
                // если достигло 20, иногда поднимаем обратно до 80 для цикличности? добавим цикл
                waterHeight = 80;
                waterLevel.style.height = waterHeight + '%';
            }
        }
        // запускаем интервал (каждые 7 секунд изменение, чтобы было заметно)
        setInterval(lowerWater, 7000);

        // также для демонстрации сразу сделаем небольшое начальное снижение через 2 сек (эффект живого)
        setTimeout(() => {
            waterHeight = 72;
            waterLevel.style.height = '72%';
        }, 2000);
        setTimeout(() => {
            waterHeight = 64;
            waterLevel.style.height = '64%';
        }, 5000);
        // интервал выше продолжит цикл

        // ========== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ (мини‑навигация) ==========
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const dots = document.querySelectorAll('.nav-dot');

        function setActivePage(pageNumber) {
            // снимаем активный класс со страниц
            if (pageNumber === 1) {
                page1.classList.add('active');
                page2.classList.remove('active');
            } else {
                page2.classList.add('active');
                page1.classList.remove('active');
            }

            // обновляем точки
            dots.forEach((dot, idx) => {
                const dotPage = idx === 0 ? 1 : 2;
                if (dotPage === pageNumber) {
                    dot.classList.add('active-dot');
                } else {
                    dot.classList.remove('active-dot');
                }
            });
        }

        dots.forEach((dot, idx) => {
            dot.addEventListener('click', () => {
                const page = idx === 0 ? 1 : 2;
                setActivePage(page);
            });
        });

        // необязательно: свайп? можно добавить позже, но пока через точки.

        // ========== дополнительно: чтобы облако первой страницы всегда было видно ==========
        // но оно уже есть.

        // если нужно при открытии второй страницы тоже запустить её печать, но она уже запущена сразу (но скрыта) — ок

        // маленькая фишка: при первом открытии второй страницы печатный текст там уже напечатан т.к. запустился сразу, но если мы хотим сбрасывать —
        // но для демо оставим так. можно добавить ресет при активации, но не обязательно.
    })();
</script>

<!-- пояснение: вода убывает плавно благодаря transition, интервал 7 сек, также запускаются капли бесконечно.
     Заголовки печатаются независимо. Три карточки подписаны слово1-3. -->
</body>
</html>
